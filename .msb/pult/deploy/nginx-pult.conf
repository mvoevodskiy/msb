# Пульт за nginx Михаила: его сервер принимает https://__DOMAIN__ (TLS там) и проксирует сюда по локальной сети.
# Шаблон: deploy/install.sh --nginx подставляет __DOMAIN__, __LAN_IP__, __LAN_PORT__, __ALLOW__, __PORT__
# и кладёт результат в /etc/nginx/sites-available/pult.conf (прежний файл — копия в pult-data/backups/nginx/).
# Слушаем только адрес в локальной сети; снаружи порт закрыт ufw (из локальной сети разрешено всё).

# IP пользователя приходит от nginx Михаила в X-Real-IP; нет заголовка — адрес соединения.
map $http_x_real_ip $pult_client_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}
limit_req_zone $pult_client_ip zone=pult_login_ip:1m rate=10r/m;

server {
    listen __LAN_IP__:__LAN_PORT__;
    server_name __DOMAIN__ _;
    allow __ALLOW__;
    deny all;
    access_log /var/log/nginx/pult.access.log;
    error_log /var/log/nginx/pult.error.log warn;
    client_max_body_size 1m;

    # Веб-сервис не отвечает (перезапуск, не запущен) — понятная страница вместо голого 502.
    error_page 502 503 504 /pult-down.html;
    location = /pult-down.html {
        root /var/www/pult;
        internal;
    }
    location = /login {
        limit_req zone=pult_login_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
        include snippets/pult-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        include snippets/pult-proxy.conf;
    }
}
