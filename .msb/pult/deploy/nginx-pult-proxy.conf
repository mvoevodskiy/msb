# /etc/nginx/snippets/pult-proxy.conf — заголовки прокси для Пульта (ставит deploy/install.sh --nginx).
# Пользователь видит https у nginx Михаила, поэтому X-Forwarded-Proto всегда https.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $pult_client_ip;
proxy_set_header X-Forwarded-For $pult_client_ip;
proxy_set_header X-Forwarded-Proto https;
proxy_read_timeout 30s;
