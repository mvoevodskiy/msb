# Drop-in: вход через run.mjs (ext: Cursor/Codex/Qwen) вместо голого index.js.
# Кладётся в msb-bot@.service.d — действует на ВСЕ инстансы (default и новые из «Мои боты»).
# Установка на сервере:
#   sudo mkdir -p /etc/systemd/system/msb-bot@.service.d
#   sudo cp /home/client/.msb/bot/systemd/60-ext-entry.conf /etc/systemd/system/msb-bot@.service.d/
#   sudo systemctl daemon-reload
#   sudo bot-ctl.sh restart all
#
# Откат: удалить drop-in и daemon-reload — снова стартует штатный index.js.
# Обновление puller'ом затирает только bot/index.js; run.mjs и ext/ сохраняются.

[Service]
ExecStart=
ExecStart=/usr/bin/node /home/client/.msb/bot/run.mjs
