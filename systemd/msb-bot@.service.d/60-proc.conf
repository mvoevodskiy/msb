# /etc/systemd/system/msb-bot@.service.d/60-proc.conf, placed by openclaw-install.sh when OpenClaw
# joins the server. Takes effect at the bot's next ordinary restart: the helper never restarts the bot.
# Other users' processes become invisible to the bot and its agent (the mirror of OpenClaw's user@).
[Service]
ProtectProc=invisible
