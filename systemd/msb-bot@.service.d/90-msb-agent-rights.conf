# Права агента: без NoNewPrivileges sudo из бота/агента мёртв.
# Opt-in полный sudo: etc/sudoers.d/msb-full-rights (не ставится bootstrap’ом).
[Service]
NoNewPrivileges=false
ProtectSystem=false
ProtectHome=false
ProtectKernelTunables=false
ProtectKernelModules=false
ProtectControlGroups=false
RestrictSUIDSGID=false
ReadWritePaths=
