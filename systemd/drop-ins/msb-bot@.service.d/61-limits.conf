# /etc/systemd/system/msb-bot@.service.d/61-limits.conf, placed by openclaw-install.sh when OpenClaw
# joins the server. Swap ceiling and OOM priority for every bot (today -500 exists only on adapter
# hosts). Running bots get the same values live (set-property --runtime, /proc/<pid>/oom_score_adj),
# without a restart.
[Service]
MemorySwapMax=256M
OOMScoreAdjust=-500
